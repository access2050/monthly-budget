<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>월간 고정지출 대시보드</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #3b82f6;
      --text: #f1f5f9;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #2d3748;
    }
    
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      margin: 0; 
      padding: 12px; 
    }
    
    .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    
    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 1rem; color: var(--subtext); }
    
    .summary-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat { display: flex; flex-direction: column; }
    .stat .label { font-size: 0.8rem; color: var(--subtext); }
    .stat .value { font-size: 1.15rem; font-weight: bold; margin-top: 2px; }
    
    .remaining { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 8px; }
    .remaining .value { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
    
    .daily-budget { background: #064e3b; border: 1px solid #047857; border-radius: 8px; padding: 10px; text-align: center; font-size: 0.85rem; color: #a7f3d0; }
    .daily-budget b { font-size: 1.05rem; color: #34d399; }
    
    /* 입력 필드 레이아웃 개선 */
    .input-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .input-row { display: flex; gap: 6px; }
    
    input, select { 
      padding: 10px; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      font-size: 0.9rem; 
      background: var(--input-bg); 
      color: var(--text);
    }
    input::placeholder { color: #64748b; }
    
    button { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; font-weight: bold; white-space: nowrap; }
    
    /* 리스트 스타일 대폭 수정 (세로 깨짐 방지) */
    .item-list { list-style: none; padding: 0; margin: 0; }
    .item { 
      display: flex; 
      flex-direction: column; 
      padding: 10px 0; 
      border-bottom: 1px solid var(--border); 
      gap: 6px; 
    }
    .item.paid .item-name { text-decoration: line-through; color: #64748b; }
    
    .item-top { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .item-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    
    .item-day { background: #334155; color: #cbd5e1; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
    .item-cat { font-size: 0.75rem; color: var(--subtext); margin-left: 4px; flex-shrink: 0; }
    .item-name { font-size: 0.95rem; font-weight: 500; word-break: break-all; }
    
    .item-bottom { display: flex; justify-content: space-between; align-items: center; width: 100%; padding-left: 26px; }
    .item-amount { font-size: 1rem; font-weight: bold; }
    .item-btns { display: flex; gap: 4px; }
    
    .btn-edit { background: #475569; padding: 4px 8px; font-size: 0.75rem; }
    .btn-del { background: #dc2626; padding: 4px 8px; font-size: 0.75rem; }
    .btn-save { background: #10b981; padding: 6px 10px; font-size: 0.8rem; }
    .btn-reset { background: #d97706; font-size: 0.75rem; padding: 4px 8px; }
    
    .backup-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-backup { background: #475569; width: 100%; }
    .btn-restore { background: #0284c7; width: 100%; }
    
    input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 수입 및 잔액 요약 -->
    <div class="card">
      <div class="card-title"><h2>월 수입 설정</h2></div>
      <div class="input-row">
        <input type="number" id="incomeInput" placeholder="월 수입 입력" style="flex:1;">
        <button onclick="saveIncome()">저장</button>
      </div>
      <div class="summary-box" style="margin-top:12px;">
        <div class="stat"><span class="label">총 수입</span><span class="value" id="dispIncome">0원</span></div>
        <div class="stat"><span class="label">남은 고정지출</span><span class="value" id="dispExpense" style="color:#f87171;">0원</span></div>
      </div>
      <div class="remaining">
        <div class="label" style="font-size:0.8rem; color:#94a3b8;">지출 차감 후 잔액</div>
        <div class="value" id="dispRemain">0원</div>
      </div>
      <div class="daily-budget" id="dispDaily">
        오늘 기준 하루 권장 생활비: <b>0원</b>
      </div>
    </div>

    <!-- 카테고리별 지출 비율 차트 -->
    <div class="card">
      <div class="card-title"><h2>카테고리별 지출 구성</h2></div>
      <canvas id="expenseChart" height="200"></canvas>
    </div>

    <!-- 고정 지출 항목 관리 -->
    <div class="card">
      <div class="card-title">
        <h2>고정지출 항목 관리</h2>
        <button class="btn-reset" onclick="resetPaidStatus()">체크 전체해제</button>
      </div>
      
      <div class="input-grid">
        <div class="input-row">
          <input type="number" id="itemDay" style="width: 70px;" placeholder="일" min="1" max="31">
          <select id="itemCat" style="flex:1;">
            <option value="금융/카드">금융/카드</option>
            <option value="교육/육아">교육/육아</option>
            <option value="공과금/통신">공과금/통신</option>
            <option value="주거/구독">주거/구독</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="input-row">
          <input type="text" id="itemName" placeholder="항목명" style="flex:1;">
          <input type="number" id="itemAmount" placeholder="금액" style="width: 100px;">
          <button onclick="addExpenseItem()">추가</button>
        </div>
      </div>
      
      <ul class="item-list" id="itemList"></ul>
    </div>

    <!-- 데이터 백업 / 복원 -->
    <div class="card">
      <div class="card-title"><h2>데이터 백업 및 복원</h2></div>
      <div class="backup-group">
        <button class="btn-backup" onclick="exportData()">백업 다운로드</button>
        <button class="btn-restore" onclick="document.getElementById('fileInput').click()">백업 불러오기</button>
      </div>
      <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="importData(event)">
    </div>
  </div>

  <script>
    let data = JSON.parse(localStorage.getItem('monthly_budget_db')) || { income: 0, lastMonth: '', items: [] };
    let editingId = null;
    let chart = null;

    function checkMonthReset() {
      const currentMonth = new Date().toISOString().slice(0, 7);
      if (data.lastMonth !== currentMonth) {
        data.lastMonth = currentMonth;
        data.items.forEach(item => item.paid = false);
        save();
      }
    }

    function save() {
      data.items.sort((a, b) => (a.day || 0) - (b.day || 0));
      localStorage.setItem('monthly_budget_db', JSON.stringify(data));
      render();
    }

    function saveIncome() {
      const val = Number(document.getElementById('incomeInput').value);
      if (!isNaN(val)) { data.income = val; save(); }
    }

    function addExpenseItem() {
      const day = Number(document.getElementById('itemDay').value) || 1;
      const cat = document.getElementById('itemCat').value;
      const name = document.getElementById('itemName').value.trim();
      const amount = Number(document.getElementById('itemAmount').value);

      if (name && amount > 0) {
        data.items.push({ id: Date.now(), day, category: cat, name, amount, paid: false });
        document.getElementById('itemDay').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemAmount').value = '';
        save();
      }
    }

    function togglePaid(id) {
      const item = data.items.find(i => i.id === id);
      if (item) {
        item.paid = !item.paid;
        save();
      }
    }

    function resetPaidStatus() {
      if (confirm('모든 항목의 납부 완료 체크를 해제하시겠습니까?')) {
        data.items.forEach(i => i.paid = false);
        save();
      }
    }

    function enableEdit(id) {
      editingId = id;
      render();
    }

    function saveEdit(id) {
      const day = Number(document.getElementById(`edit-day-${id}`).value) || 1;
      const cat = document.getElementById(`edit-cat-${id}`).value;
      const name = document.getElementById(`edit-name-${id}`).value.trim();
      const amount = Number(document.getElementById(`edit-amount-${id}`).value);

      if (name && amount > 0) {
        const item = data.items.find(i => i.id === id);
        if (item) {
          item.day = day;
          item.category = cat;
          item.name = name;
          item.amount = amount;
        }
        editingId = null;
        save();
      }
    }

    function removeItem(id) {
      data.items = data.items.filter(item => item.id !== id);
      if (editingId === id) editingId = null;
      save();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement('a');
      const today = new Date().toISOString().slice(0, 10);
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `budget_backup_${today}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (typeof importedData.income === 'number' && Array.isArray(importedData.items)) {
            data = importedData;
            save();
            alert('성공적으로 데이터를 복원했습니다.');
          } else {
            alert('올바르지 않은 데이터 형식입니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    function render() {
      const totalExpense = data.items.reduce((acc, cur) => acc + cur.amount, 0);
      const pendingExpense = data.items.filter(i => !i.paid).reduce((acc, cur) => acc + cur.amount, 0);
      const remaining = data.income - totalExpense;

      const now = new Date();
      const lastDayOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const daysLeft = Math.max(1, lastDayOfMonth - now.getDate() + 1);
      const dailyBudget = Math.max(0, Math.floor((data.income - pendingExpense) / daysLeft));

      document.getElementById('dispIncome').innerText = data.income.toLocaleString() + '원';
      document.getElementById('dispExpense').innerText = pendingExpense.toLocaleString() + '원';
      document.getElementById('dispRemain').innerText = remaining.toLocaleString() + '원';
      document.getElementById('dispDaily').innerHTML = `이번 달 남은 <b>${daysLeft}일</b> 동안 하루 권장 생활비: <b>${dailyBudget.toLocaleString()}원</b>`;

      const listEl = document.getElementById('itemList');
      listEl.innerHTML = data.items.map(item => {
        if (editingId === item.id) {
          return `
            <li class="item">
              <div class="input-grid">
                <div class="input-row">
                  <input type="number" id="edit-day-${item.id}" value="${item.day || 1}" style="width:60px;" min="1" max="31">
                  <select id="edit-cat-${item.id}" style="flex:1;">
                    <option value="금융/카드" ${item.category==='금융/카드'?'selected':''}>금융/카드</option>
                    <option value="교육/육아" ${item.category==='교육/육아'?'selected':''}>교육/육아</option>
                    <option value="공과금/통신" ${item.category==='공과금/통신'?'selected':''}>공과금/통신</option>
                    <option value="주거/구독" ${item.category==='주거/구독'?'selected':''}>주거/구독</option>
                    <option value="기타" ${item.category==='기타'?'selected':''}>기타</option>
                  </select>
                </div>
                <div class="input-row">
                  <input type="text" id="edit-name-${item.id}" value="${item.name}" style="flex:1;">
                  <input type="number" id="edit-amount-${item.id}" value="${item.amount}" style="width:90px;">
                  <button class="btn-save" onclick="saveEdit(${item.id})">완료</button>
                </div>
              </div>
            </li>
          `;
        }
        return `
          <li class="item ${item.paid ? 'paid' : ''}">
            <div class="item-top">
              <div class="item-left">
                <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="togglePaid(${item.id})">
                <span class="item-day">${item.day || 1}일</span>
                <span class="item-name">${item.name}</span>
                <span class="item-cat">[${item.category || '기타'}]</span>
              </div>
            </div>
            <div class="item-bottom">
              <span class="item-amount">${item.amount.toLocaleString()}원</span>
              <div class="item-btns">
                <button class="btn-edit" onclick="enableEdit(${item.id})">수정</button>
                <button class="btn-del" onclick="removeItem(${item.id})">삭제</button>
              </div>
            </div>
          </li>
        `;
      }).join('');

      updateCategoryChart(remaining);
    }

    function updateCategoryChart(remaining) {
      const ctx = document.getElementById('expenseChart').getContext('2d');
      
      const categoryTotals = {};
      data.items.forEach(item => {
        const cat = item.category || '기타';
        categoryTotals[cat] = (categoryTotals[cat] || 0) + item.amount;
      });

      const labels = [];
      const chartData = [];
      const colors = [];

      const colorMap = {
        '금융/카드': '#ef4444',
        '교육/육아': '#f59e0b',
        '공과금/통신': '#10b981',
        '주거/구독': '#6366f1',
        '기타': '#8b5cf6',
        '가용 잔액': '#3b82f6'
      };

      for (const [cat, sum] of Object.entries(categoryTotals)) {
        if (sum > 0) {
          labels.push(cat);
          chartData.push(sum);
          colors.push(colorMap[cat] || '#64748b');
        }
      }

      if (remaining > 0) {
        labels.push('가용 잔액');
        chartData.push(remaining);
        colors.push(colorMap['가용 잔액']);
      }

      const totalVal = chartData.reduce((a, b) => a + b, 0);

      if (chart) chart.destroy();
      
      Chart.register(ChartDataLabels);

      chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: chartData,
            backgroundColor: colors,
            borderWidth: 1,
            borderColor: '#1e1e1e'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#cbd5e1',
                padding: 12,
                font: { size: 11 },
                generateLabels: function(chart) {
                  const data = chart.data;
                  return data.labels.map((label, i) => {
                    const value = data.datasets[0].data[i];
                    const pct = totalVal > 0 ? ((value / totalVal) * 100).toFixed(1) : 0;
                    return {
                      text: `${label}: ${value.toLocaleString()}원 (${pct}%)`,
                      fillStyle: data.datasets[0].backgroundColor[i],
                      hidden: isNaN(data.datasets[0].data[i]) || chart.getDatasetMeta(0).data[i].hidden,
                      index: i
                    };
                  });
                }
              }
            },
            datalabels: {
              color: '#ffffff',
              font: { weight: 'bold', size: 11 },
              formatter: (value) => {
                if (totalVal === 0) return '';
                const pct = (value / totalVal * 100).toFixed(1);
                return pct >= 5 ? `${pct}%` : '';
              }
            }
          }
        }
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    checkMonthReset();
    render();
  </script>
</body>
</html>
